<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="perfumeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c44569;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bottle shadow -->
  <ellipse cx="200" cy="380" rx="80" ry="10" fill="#e9ecef" opacity="0.3"/>

  <!-- Bottle body -->
  <rect x="160" y="100" width="80" height="250" rx="15" ry="15" fill="url(#bottleGradient)" stroke="#dee2e6" stroke-width="2"/>

  <!-- Bottle neck -->
  <rect x="185" y="50" width="30" height="60" rx="8" ry="8" fill="url(#bottleGradient)" stroke="#dee2e6" stroke-width="2"/>

  <!-- Bottle cap -->
  <rect x="175" y="30" width="50" height="25" rx="12" ry="12" fill="#343a40" stroke="#212529" stroke-width="1"/>

  <!-- Perfume liquid -->
  <rect x="170" y="300" width="60" height="40" rx="5" ry="5" fill="url(#perfumeGradient)"/>

  <!-- Bottle label -->
  <rect x="170" y="180" width="60" height="80" rx="5" ry="5" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="210" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#495057">LUXE</text>
  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#6c757d">PERFUME</text>
  <text x="200" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#6c757d">50ml EDP</text>
</svg>