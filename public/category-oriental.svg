<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orientalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdcb6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e17055;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orientalAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e84393;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#orientalBg)"/>

  <!-- Decorative patterns (inspired by oriental designs) -->
  <circle cx="100" cy="80" r="20" fill="#d63031" opacity="0.8"/>
  <circle cx="320" cy="70" r="18" fill="#e17055" opacity="0.7"/>
  <circle cx="80" cy="200" r="15" fill="#fdcb6e" opacity="0.6"/>
  <circle cx="280" cy="190" r="22" fill="#d63031" opacity="0.8"/>
  <circle cx="200" cy="120" r="25" fill="#e84393" opacity="0.7"/>

  <!-- Star patterns -->
  <polygon points="100,80 105,95 120,95 110,105 115,120 100,110 85,120 90,105 80,95 95,95" fill="#d63031"/>
  <polygon points="320,70 323,78 331,78 326,83 329,91 320,86 311,91 314,83 309,78 317,78" fill="#e17055"/>
  <polygon points="200,120 205,130 215,130 208,137 211,147 200,140 189,147 192,137 185,130 195,130" fill="#e84393"/>

  <!-- Curved decorative lines -->
  <path d="M 50 60 Q 200 30 350 60" stroke="#d63031" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 350 240 Q 200 270 50 240" stroke="#d63031" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 60 150 Q 200 120 340 150" stroke="#e17055" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Spice-like elements -->
  <ellipse cx="150" cy="180" rx="12" ry="6" fill="#8e44ad"/>
  <ellipse cx="250" cy="170" rx="10" ry="5" fill="#9b59b6"/>
  <ellipse cx="180" cy="210" rx="8" ry="4" fill="#8e44ad"/>
  <ellipse cx="220" cy="200" rx="11" ry="5" fill="#9b59b6"/>

  <!-- Category text -->
  <rect x="50" y="220" width="300" height="60" rx="30" fill="rgba(255,255,255,0.9)" stroke="#d63031" stroke-width="2"/>
  <text x="200" y="250" text-anchor="middle" font-family="serif" font-size="24" font-weight="bold" fill="#d63031">ORIENTAL</text>
  <text x="200" y="270" text-anchor="middle" font-family="serif" font-size="14" fill="#636e72">Amber • Vanilla • Spices</text>

  <!-- Additional decorative elements -->
  <path d="M 120 100 Q 140 90 160 100 Q 140 110 120 100" fill="#fdcb6e" opacity="0.6"/>
  <path d="M 240 110 Q 260 100 280 110 Q 260 120 240 110" fill="#fdcb6e" opacity="0.6"/>
</svg>