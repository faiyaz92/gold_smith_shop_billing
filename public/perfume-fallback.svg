<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fallbackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fallbackPerfume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b2bec3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#636e72;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bottle shadow -->
  <ellipse cx="200" cy="380" rx="80" ry="10" fill="#e9ecef" opacity="0.3"/>

  <!-- Bottle body -->
  <rect x="160" y="100" width="80" height="250" rx="15" ry="15" fill="url(#fallbackGradient)" stroke="#adb5bd" stroke-width="2"/>

  <!-- Bottle neck -->
  <rect x="185" y="50" width="30" height="60" rx="8" ry="8" fill="url(#fallbackGradient)" stroke="#adb5bd" stroke-width="2"/>

  <!-- Bottle cap -->
  <rect x="175" y="30" width="50" height="25" rx="12" ry="12" fill="#636e72" stroke="#2d3436" stroke-width="1"/>

  <!-- Perfume liquid -->
  <rect x="170" y="320" width="60" height="20" rx="5" ry="5" fill="url(#fallbackPerfume)"/>

  <!-- Bottle label -->
  <rect x="170" y="180" width="60" height="80" rx="5" ry="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/>
  <text x="200" y="210" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#495057">PERFUME</text>
  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#6c757d">IMAGE</text>
  <text x="200" y="245" text-anchor="middle" font-family="serif" font-size="10" fill="#6c757d">NOT FOUND</text>

  <!-- Question mark overlay -->
  <circle cx="200" cy="140" r="20" fill="#ff7675" stroke="#d63031" stroke-width="2"/>
  <text x="200" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">?</text>
</svg>